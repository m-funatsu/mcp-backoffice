version: '3.8'

# AI-OS デモ環境用 Docker Compose 設定
# 独立したデモ環境を素早く構築するための設定

services:
  # アプリケーションサーバー
  app:
    image: ai-os/app:${DEMO_VERSION:-1.0.0}
    container_name: ${DEMO_ENV_NAME}-app
    environment:
      - NODE_ENV=demo
      - APP_NAME=AI-OS Demo - ${DEMO_COMPANY_NAME}
      - DB_HOST=${DEMO_ENV_NAME}-db
      - DB_PORT=5432
      - DB_NAME=aios_demo
      - DB_USER=aios
      - DB_PASSWORD=${DEMO_DB_PASSWORD:-DemoPass123!}
      - REDIS_HOST=${DEMO_ENV_NAME}-redis
      - REDIS_PORT=6379
      - JWT_SECRET=${DEMO_JWT_SECRET:-demo-jwt-secret-change-in-prod}
      - DEMO_MODE=true
      - DEMO_EXPIRY=${DEMO_EXPIRY}
    ports:
      - "${DEMO_PORT_APP:-0}:3000"
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads/${DEMO_ENV_NAME}:/app/uploads
      - ./logs/${DEMO_ENV_NAME}:/app/logs
    networks:
      - demo-network
    restart: unless-stopped
    labels:
      - "ai-os.demo=true"
      - "ai-os.company=${DEMO_COMPANY_NAME}"
      - "expiry=${DEMO_EXPIRY}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # データベース
  db:
    image: postgres:15-alpine
    container_name: ${DEMO_ENV_NAME}-db
    environment:
      - POSTGRES_USER=aios
      - POSTGRES_PASSWORD=${DEMO_DB_PASSWORD:-DemoPass123!}
      - POSTGRES_DB=aios_demo
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=ja_JP.UTF-8
    volumes:
      - demo-db-data-${DEMO_ENV_NAME}:/var/lib/postgresql/data
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./scripts/demo-specific.sql:/docker-entrypoint-initdb.d/02-demo.sql:ro
    networks:
      - demo-network
    restart: unless-stopped
    labels:
      - "ai-os.demo=true"
      - "expiry=${DEMO_EXPIRY}"
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  # Redis（キャッシュ）
  redis:
    image: redis:7-alpine
    container_name: ${DEMO_ENV_NAME}-redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - demo-redis-data-${DEMO_ENV_NAME}:/data
    networks:
      - demo-network
    restart: unless-stopped
    labels:
      - "ai-os.demo=true"
      - "expiry=${DEMO_EXPIRY}"

  # Nginx（リバースプロキシ）
  nginx:
    image: nginx:alpine
    container_name: ${DEMO_ENV_NAME}-nginx
    ports:
      - "${DEMO_PORT_HTTPS:-0}:443"
      - "${DEMO_PORT_HTTP:-0}:80"
    volumes:
      - ./nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl/${DEMO_ENV_NAME}:/etc/nginx/ssl
      - demo-nginx-cache-${DEMO_ENV_NAME}:/var/cache/nginx
      - ./static:/usr/share/nginx/html/static:ro
    environment:
      - DEMO_SUBDOMAIN=${DEMO_SUBDOMAIN}
      - APP_HOST=${DEMO_ENV_NAME}-app
      - APP_PORT=3000
    networks:
      - demo-network
    depends_on:
      - app
    restart: unless-stopped
    labels:
      - "ai-os.demo=true"
      - "expiry=${DEMO_EXPIRY}"

  # デモデータジェネレーター（初期化時のみ実行）
  demo-generator:
    image: ai-os/demo-generator:${DEMO_VERSION:-1.0.0}
    container_name: ${DEMO_ENV_NAME}-generator
    environment:
      - DB_HOST=${DEMO_ENV_NAME}-db
      - DB_PORT=5432
      - DB_NAME=aios_demo
      - DB_USER=aios
      - DB_PASSWORD=${DEMO_DB_PASSWORD:-DemoPass123!}
      - COMPANY_ID=${DEMO_COMPANY_ID}
      - COMPANY_NAME=${DEMO_COMPANY_NAME}
      - ADMIN_EMAIL=${DEMO_ADMIN_EMAIL}
      - DATA_SIZE=${DEMO_DATA_SIZE:-small}
      - MONTHS_HISTORY=${DEMO_MONTHS_HISTORY:-3}
    depends_on:
      - db
    networks:
      - demo-network
    restart: "no"
    labels:
      - "ai-os.demo=true"
      - "ai-os.temp=true"

  # 監視エージェント（軽量版）
  monitor:
    image: ai-os/monitor-lite:${DEMO_VERSION:-1.0.0}
    container_name: ${DEMO_ENV_NAME}-monitor
    environment:
      - MONITOR_TARGETS=app,db,redis,nginx
      - ALERT_WEBHOOK=${DEMO_ALERT_WEBHOOK}
      - DEMO_ENV_NAME=${DEMO_ENV_NAME}
    depends_on:
      - app
      - db
      - redis
    networks:
      - demo-network
    restart: unless-stopped
    labels:
      - "ai-os.demo=true"
      - "expiry=${DEMO_EXPIRY}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

# ネットワーク設定
networks:
  demo-network:
    name: ${DEMO_ENV_NAME}-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.${DEMO_SUBNET:-20}.0.0/16

# ボリューム設定
volumes:
  demo-db-data-${DEMO_ENV_NAME}:
    name: demo-db-data-${DEMO_ENV_NAME}
    labels:
      - "ai-os.demo=true"
      - "expiry=${DEMO_EXPIRY}"
  
  demo-redis-data-${DEMO_ENV_NAME}:
    name: demo-redis-data-${DEMO_ENV_NAME}
    labels:
      - "ai-os.demo=true"
      - "expiry=${DEMO_EXPIRY}"
  
  demo-nginx-cache-${DEMO_ENV_NAME}:
    name: demo-nginx-cache-${DEMO_ENV_NAME}
    labels:
      - "ai-os.demo=true"
      - "expiry=${DEMO_EXPIRY}"